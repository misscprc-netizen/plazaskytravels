<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130">
  <defs>
    <!-- Metallic silver gradient for SKY -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d8dde2"/>
      <stop offset="45%"  stop-color="#f0f3f6"/>
      <stop offset="100%" stop-color="#9aa0a8"/>
    </linearGradient>
    <!-- Gold gradient for airplane -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e8c96d"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>

  <!-- ═══ PLAZA — white so it reads on dark backgrounds ═══ -->
  <text x="6" y="74"
        font-family="'Arial Black','Franklin Gothic Heavy','Impact',sans-serif"
        font-weight="900"
        font-size="62"
        fill="#ffffff"
        letter-spacing="-1">PLAZA</text>

  <!-- ═══ SKY — metallic silver ═══ -->
  <text x="6" y="122"
        font-family="'Arial Black','Franklin Gothic Heavy','Impact',sans-serif"
        font-weight="900"
        font-size="50"
        fill="url(#silverGrad)"
        letter-spacing="4">SKY</text>

  <!-- ═══ "travel & tourism" — gold so it reads on dark ═══ -->
  <text x="182" y="98"
        font-family="Arial,Helvetica,sans-serif"
        font-size="13.5"
        fill="#C9A84C"
        letter-spacing="0.3">travel &amp;</text>
  <text x="182" y="116"
        font-family="Arial,Helvetica,sans-serif"
        font-size="13.5"
        fill="#C9A84C"
        letter-spacing="0.3">tourism</text>

  <!-- ═══ Speed lines — white/cream for visibility on dark backgrounds ═══ -->
  <g stroke-linecap="round" fill="none">
    <line x1="300" y1="12"  x2="516" y2="12"  stroke="rgba(255,255,255,0.45)" stroke-width="3.5"/>
    <line x1="290" y1="27"  x2="518" y2="27"  stroke="rgba(255,255,255,0.55)" stroke-width="4"/>
    <line x1="282" y1="42"  x2="519" y2="42"  stroke="rgba(255,255,255,0.68)" stroke-width="4.5"/>
    <line x1="276" y1="57"  x2="520" y2="57"  stroke="rgba(255,255,255,0.80)" stroke-width="5"/>
    <line x1="274" y1="72"  x2="520" y2="72"  stroke="rgba(255,255,255,0.80)" stroke-width="5"/>
    <line x1="276" y1="87"  x2="519" y2="87"  stroke="rgba(255,255,255,0.68)" stroke-width="4.5"/>
    <line x1="284" y1="102" x2="518" y2="102" stroke="rgba(255,255,255,0.55)" stroke-width="4"/>
    <line x1="296" y1="117" x2="516" y2="117" stroke="rgba(255,255,255,0.45)" stroke-width="3.5"/>
  </g>

  <!-- ═══ Airplane — burgundy ═══ -->
  <g transform="translate(395,64) rotate(-22)" fill="#5C1233">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="62" ry="9"/>
    <!-- Nose cone -->
    <path d="M58,-4 Q80,0 58,4 Z"/>
    <!-- Main wings -->
    <path d="M8,-8  L30,-8  L52,30  L22,18  Z"/>
    <path d="M8,-8  L30,-8  L52,-32 L22,-20 Z"/>
    <!-- Tail stabilisers -->
    <path d="M-44,-7 L-28,-7 L-28,-24 L-52,-17 Z"/>
    <path d="M-44, 7 L-28, 7 L-28, 24 L-52, 17 Z"/>
    <!-- Tail vertical fin -->
    <path d="M-50,-8 L-32,-8 L-32,-30 L-50,-14 Z"/>
    <!-- Window dots -->
    <circle cx="20"  cy="-1" r="2.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="10"  cy="-1" r="2.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="0"   cy="-1" r="2.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="-10" cy="-1" r="2.2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="-20" cy="-1" r="2.2" fill="rgba(255,255,255,0.5)"/>
  </g>
</svg>
